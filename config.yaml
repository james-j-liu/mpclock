# MPCLock pipeline configuration

corpus:
  sitemap_url: "https://www.bankofengland.co.uk/_api/sitemap/getsitemap"
  start_year: 1997        # BoE gained independence + MPC created May 1997.
  end_year: 2026
  # Each Monetary Policy / Inflation Report is one judged document, holding the
  # whole PDF — chapters, In focus boxes and annexes included. Set true to score
  # every section, box and annex as its own document instead (~6x the documents,
  # ~6x the pairwise cost).
  split_report_sections: false

judge:
  provider: openrouter
  model: "google/gemini-2.5-flash-lite"   # chat model: policy classification only
  # Scoring runs on TypeSafe's Jev decision model: it answers a typed choice/score
  # question instead of writing text, bills input only ($0.042/M, output free) and
  # shows far less slot-A bias than the chat judge. PAIRWISE_MODEL / DIRECT_MODEL
  # env vars override; a non-Jev id falls back to the chat judges below.
  pairwise_model: "typesafe/jev-1.13"
  direct_model: "typesafe/jev-1.13"
  # Jev's context is 32k tokens and a comparison carries two excerpts, so each is
  # capped here; longer documents are sampled 40/20/40 (opening/middle/close).
  jev_excerpt_chars: 56000
  validator_model: "anthropic/claude-haiku-4.5"  # cross-model check on a subset
  # Chat-judge settings (used only when a non-Jev scoring model is configured).
  # Every comparison sends two excerpts and the run makes ~15 per document, so
  # this cap is the token bill; over it a document is sampled head/middle/tail.
  max_excerpt_chars: 20000
  # …except these, judged whole however long: the minutes and each Monetary
  # Policy Report with its annexes. (Jev cannot do this — its window is fixed.)
  uncapped_types: [mp_account, mp_report]
  temperature: 0.0
  concurrency: 8

tournament:
  initial_mu: 50.0
  initial_sigma: 8.333
  target_appearances_per_speech: 30   # FedLock parity (=> ~15*N comparisons)
  # Jev verdicts below this confidence are recorded as draws, not wins: most calls
  # between closely matched documents are near coin-flips, and treating them as
  # decisive adds noise (split-half reliability 0.54 -> 0.67; draw_experiment.py).
  draw_below_confidence: 0.60
  draw_probability: 0.75    # TrueSkill's prior that equal documents come out level
  sigma_convergence: 2.0
  pairing:
    swiss_fraction: 0.6
    uncertainty_fraction: 0.3
    random_fraction: 0.1

era_adjustment:
  recenter_to: 50.0
  period: quarter

timeline:
  gaussian_sigma_days: 45
  sample_freq: weekly

macro:
  # UK analogues of FedLock's Core PCE / unemployment / GDP / VIX.
  # Keys are "{ons_topic}|{cdid}|{dataset}" for the ONS timeseries endpoint.
  series:
    core_cpi: "economy/inflationandpriceindices|dko8|mm23"   # CPI excl energy/food/alc/tobacco, YoY %
    unemployment: "employmentandlabourmarket/peoplenotinwork/unemployment|mgsx|lms"  # rate 16+, %
    gdp_growth: "economy/grossdomesticproductgdp|ihyr|qna"   # real GDP, YoY %
    vix: null   # optional equity-vol analogue; unset by default

proof_of_concept:
  n_speeches: 50
  appearances_per_speech: 15
