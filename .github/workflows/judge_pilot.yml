name: Scoring-model pilot

# Re-judges a sample of logged comparisons with another decision model
# (scripts/pilot_judge.py) and commits data/processed/judge_pilot.json to the branch.
on:
  workflow_dispatch:
    inputs:
      model:
        description: "decision model id"
        default: "nace-ai/drex-max-finance"
  push:
    branches: ["claude/**"]
    paths:
      - "scripts/pilot_judge.py"
      - ".github/workflows/judge_pilot.yml"

permissions:
  contents: write

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Pilot
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PAIRWISE_MODEL: ${{ inputs.model || 'nace-ai/drex-max-finance' }}
        run: python -u scripts/pilot_judge.py --n 200
      - name: Commit
        run: |
          git config user.name "mpclock-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f data/processed/judge_pilot.json
          git commit -m "scoring-model pilot" || exit 0
          for i in 1 2 3 4 5; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((i * 5))
          done
          exit 1
