name: Press interview intake
run-name: "Press interview ${{ inputs.request_id || github.event.issue.number }}"

# Adds a press interview to the corpus. Two ways in:
#  - the site's Press interviews tab, which starts this workflow directly
#    (workflow_dispatch) using a token the owner saved in their own browser;
#  - a GitHub issue titled "[press-interview] …" (the fallback, no token needed).
# The submission is checked for duplicates, classified, added if policy-relevant and
# coded for forward guidance; the outcome is written to press_interviews.json (and,
# for an issue, posted on it), then the daily run is started so the interview is
# scored and the forecast refreshed.
on:
  workflow_dispatch:
    inputs:
      payload:
        description: "Submission: 'Member:/Date:/Outlet:/URLs:' lines, then 'Transcript:' and the text"
        required: true
        type: string
      request_id:
        description: "Id the page uses to find this run's result"
        required: false
        type: string
  issues:
    types: [opened, edited]

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: daily-update        # never write the corpus at the same time as the daily run
  cancel-in-progress: false

jobs:
  ingest:
    # a dispatch needs write access to the repository already; an issue must come
    # from the owner or a collaborator
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (startsWith(github.event.issue.title, '[press-interview]') &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Write the submission to a file
        env:
          BODY: ${{ github.event_name == 'workflow_dispatch' && inputs.payload || github.event.issue.body }}
        run: printf '%s' "$BODY" > "$RUNNER_TEMP/submission.md"
      - name: Ingest
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          JUDGE_MODEL: google/gemini-2.5-flash-lite
          ISSUE: ${{ github.event.issue.number }}
          REQUEST_ID: ${{ inputs.request_id }}
        run: >-
          python -u scripts/press_interview.py --body "$RUNNER_TEMP/submission.md"
          ${ISSUE:+--issue "$ISSUE"} ${REQUEST_ID:+--request-id "$REQUEST_ID"}
          --summary "$RUNNER_TEMP/summary.md"
      - name: Commit
        run: |
          git config user.name "mpclock-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/processed/corpus.jsonl data/processed/press_interviews.json data/processed/guidance_codes.json site/press_interviews.json
          git commit -m "press interview ${REQUEST_ID:-#$ISSUE}" || echo "nothing to commit"
          git pull --rebase origin main && git push origin HEAD:main
        env:
          ISSUE: ${{ github.event.issue.number }}
          REQUEST_ID: ${{ inputs.request_id }}
      - name: Report on the issue
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment ${{ github.event.issue.number }} --repo ${{ github.repository }} --body-file "$RUNNER_TEMP/summary.md"
          gh issue close ${{ github.event.issue.number }} --repo ${{ github.repository }}
      - name: Start the daily run (scores it, refreshes the forecast and the site)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run daily.yml --repo ${{ github.repository }} --ref main || true
